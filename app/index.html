function cleSemaine(){
  const d = new Date(), t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const an = t.getUTCFullYear(); return an*100 + Math.ceil(((t - Date.UTC(an,0,1))/864e5 + 1)/7);
}
function medailleDe(F, res){
  const v = F.mesure==="reussies" ? res.reussies : res.banque;
  let m = v>=F.seuils[0] ? 0 : -1;
  if(v>=F.seuils[1]) m = 1; if(v>=F.seuils[2]) m = 2;
  if(m>=1 && res.sansJoker) m = 2;
  return m;
}
function tirerCoffre(rnd){
  const r = rnd(), j = rnd();
  if(r < .30) return {type:"or", montant:50};
  if(r < .45) return {type:"or", montant:100};
  if(r < .70) return {type:"joker", joker:["indices","melanges","passes"][Math.floor(j*3)]};
  if(r < .75) return {type:"vie"};
  if(r < .90) return {type:"malus"};
  return {type:"perte"};
}
function fantome(p){
  const j = aujourdhui(), f = store.get("fantome", null);
  if(f && f.jour === j) return {traj:f.traj, nom:"Votre meilleure partie"};
  const r = aleaGraine(j*5 + 3), pr = {v:.84, b:.62, r:.40, n:.20}; let cum = 0; const traj = [];
  for(const nv of p.parcours){ if(r() < pr[nv]) cum += Math.round(NIVEAUX[nv].gain*1.4); traj.push(cum); }
  return {traj, nom:"L'ombre"};
}

let P = null, minuteur = null;
function nouvellePartie(mode, nivEntrainement, opt={}){
  arreterVitrine();
  // séries : cartes préparées d'abord (thème, ou dictionnaire de l'autre langue chargé à la demande)
  if(mode==="serie" && !opt.cfg){
    Series.config(opt.serie).then(cfg => cfg ? nouvellePartie("serie", null, {...opt, cfg}) : nouvellePartie("defi")).catch(() => toast(Series.TXT.echec, 4000));
    return;
  }
  Pub.avantPartie().then(() => demarrerPartie(mode, nivEntrainement, opt));
}
function demarrerPartie(mode, nivEntrainement, opt){
  const seed = (mode==="jour" || mode==="duel") ? aujourdhui()*7 + 13 : mode==="semaine" ? cleSemaine()*11 + 5 : null;
  const rnd = seed != null ? aleaGraine(seed) : Math.random;
  let cfg = null;
  if(mode==="defi") cfg = {cartes:[...PARCOURS_DEFI], vies:VIES, regles:{...REGLES_DEFAUT, ...store.get("reglesDefi", {})}};
  else if(mode==="jour" || mode==="duel") cfg = {cartes:[...PARCOURS_DEFI], vies:VIES, regles:{...REGLES_JOUR}};
  else if(mode==="semaine"){ const t = TWISTS[cleSemaine() % TWISTS.length];
    cfg = {cartes:[...(t.cartes || PARCOURS_DEFI)], vies:t.vies || VIES, regles:{...REGLES_JOUR, ...(t.regles || {})}, tf:t.tf || 1, gm:t.gm || 1, sansJoker:!!t.sansJoker, twist:t}; }
  else if(mode==="serie") cfg = opt.cfg;
  else if(mode==="festival"){ const F = FESTIVAL[opt.manche];
    cfg = {cartes:[...F.cartes], vies:F.vies, regles:{...REGLES_NULLES, ...F.regles}, tf:F.tf || 1, gm:F.gm || 1, coffrePos:F.coffrePos, legPos:F.legPos, F, manche:opt.manche}; }
  const R = cfg ? cfg.regles : {...REGLES_NULLES}, sans = !!(cfg && cfg.sansJoker);
  window.QLN_LANGUE_CARTE = (cfg && cfg.langueCartes) || null;   // cartes dans l'autre langue : définitions et contestation adaptées
  P = { mode, rnd, nivEntrainement, cfg, regles:R, parcours: cfg ? cfg.cartes : null,
    chrono: mode==="entrainement" ? store.get("chronoEntr", false) : true,
    manche:0, banque:0, cagnotte:0, serie:0, vies: cfg ? cfg.vies : VIES, viesMax: cfg ? cfg.vies : VIES,
    indices: sans ? 0 : (R.jokers ? 1 : INDICES), melanges: R.jokers ? 1 : Infinity, passes: (R.jokers && !sans) ? 1 : 0,
    tempsBonus:0, jokersUtilises:0, pubsRecompense:0,
    deja:new Set(), historique:[], carte:null, evenements:{}, evts:{}, coffres:{}, legendaire:null, traj:[], ghost:null };
  if(cfg){
    const n = cfg.cartes.length;
    if(mode==="defi" && !R.coffre) for(let i=1; i<n; i++){ if(rnd() < .28) P.evenements[i] = Math.floor(rnd()*CASES_SPECIALES.length); }
    P.cartes = cfg.cartes.map(nv => tirerCarte(nv, rnd, P.deja));
    if(R.evenements){ let prec = -9; for(let i=1; i<n; i++){ const a = rnd(), b = Math.floor(rnd()*EVENEMENTS.length); if(i - prec > 1 && a < .2){ P.evts[i] = EVENEMENTS[b]; prec = i; } } }
    if(R.coffre) for(const pos of (cfg.coffrePos || COFFRE_POS)) if(pos < n) P.coffres[pos] = [0,1,2].map(() => tirerCoffre(rnd));
    if(R.legendaire){ const pos = cfg.legPos != null ? cfg.legPos : 7; if(pos < n) P.legendaire = {pos, carte:tirerCarte("n", rnd, P.deja), fait:false}; }
  }
  if(mode==="duel") P.ghost = fantome(P);
  etapesAvantCarte();
}

/* ----- étapes entre deux cartes : coffre, légendaire, événement, choix de la carte ----- */
async function etapesAvantCarte(){
  if(!P.parcours) return lancerManche();
  const i = P.manche;
  if(P.coffres[i]) await ouvrirCoffre(P.coffres[i]);
  P.legAccepte = false;
  if(P.legendaire && P.legendaire.pos === i && !P.legendaire.fait){
    P.legendaire.fait = true;
    if(await offreLegendaire()){ P.cartes[i] = P.legendaire.carte; P.parcours[i] = "n"; P.legAccepte = true; }
  }
  if(!P.legAccepte && P.evts[i]){ P.evtCourant = (await annonceEvenement(P.evts[i])) ? P.evts[i] : null; }
  if(P.regles.choix3 && !P.legAccepte) await choisirCarte();
  lancerManche();
}
function annonceEvenement(evt){
  return new Promise(res => {
    const v = panneau({ classe:evt.classe, titre:"Carte événement", corps:`
      <div class="case-speciale piece ${evt.classe}">${esc(evt.nom)}</div>
      <p class="texte-centre">${evt.texte}</p>
      <div class="duo"><button class="bouton piece c-vert" id="ev-oui">Relever</button><button class="bouton piece c-noir" id="ev-non" ${P.banque < PRIX.esquive ? "disabled" : ""}>Esquiver −${PRIX.esquive} €</button></div>` });
    $("#ev-oui", v).focus();
    $("#ev-oui", v).onclick = () => { v.remove(); res(true); };
    $("#ev-non", v).onclick = () => { P.banque -= PRIX.esquive; Son.ko(); v.remove(); res(false); };
  });
}
function offreLegendaire(){
  return new Promise(res => {
    const v = panneau({ classe:"c-noir", titre:"Carte légendaire", valeur:"×3", corps:`
      <div class="case-speciale piece c-noir">Légendaire</div>
      <p class="texte-centre">Un mot de 10 lettres ou plus, 3 minutes, gain ×3. Un échec coûte une vie.</p>
      <div class="duo"><button class="bouton piece c-rouge" id="lg-oui">Tenter</button><button class="bouton piece c-noir" id="lg-non">Refuser</button></div>` });
    $("#lg-oui", v).onclick = () => { v.remove(); res(true); };
    $("#lg-non", v).onclick = () => { v.remove(); res(false); };
  });
}
function choisirCarte(){
  return new Promise(res => {
    const i = P.manche, niv = P.parcours[i], N = NIVEAUX[niv];
    let cartes = [P.cartes[i], tirerCarte(niv, P.rnd, P.deja), tirerCarte(niv, P.rnd, P.deja)];
    cartes = melanger(cartes);
    const v = panneau({ classe:N.classe, titre:"Choisissez votre carte", valeur:N.gain+" €", corps:`
      <p class="texte-centre">Trois cartes ${N.nom.toLowerCase()}s face cachée. Seule la longueur du mot est visible.</p>
      <div class="trois">${cartes.map((c,k) => `<button class="piece ${N.classe}" data-k="${k}"><b>${norm(c.origine).length}</b><small>lettres</small></button>`).join("")}</div>` });
    $$("[data-k]", v).forEach(b => b.onclick = () => { P.cartes[i] = cartes[+b.dataset.k]; v.remove(); res(); });
  });
}
function appliquerCoffre(o){
  if(o.type==="or"){ P.banque += o.montant; Son.piece(); return {classe:"c-violet", titre:"+"+o.montant+" €", texte:"La banque vous verse "+o.montant+" €."}; }
  if(o.type==="joker"){ P[o.joker]++; Son.piece(); return {classe:"c-vert", titre:"Joker", texte:"Vous gagnez "+NOM_JOKER[o.joker]+"."}; }
  if(o.type==="vie"){
    if(P.vies < P.viesMax){ P.vies++; Son.piece(); return {classe:"c-jaune", titre:"Une vie", texte:"Vous regagnez une vie."}; }
    P.banque += 50; Son.piece(); return {classe:"c-violet", titre:"+50 €", texte:"Vies au maximum : la banque vous verse 50 € à la place."};
  }
  if(o.type==="malus"){ const m = Math.min(30, P.banque); P.banque -= m; Son.ko(); return {classe:"c-orange", titre:"−"+m+" €", texte:"Vous versez "+m+" € à la banque."}; }
  const avant = P.cagnotte; P.cagnotte = arr5(P.cagnotte*0.75); Son.ko();
  return {classe:"c-orange", titre:"Voleur", texte: avant>0 ? "Un voleur emporte "+euros(avant-P.cagnotte)+" de votre cagnotte." : "Un voleur passe, mais votre cagnotte est vide."};
}
function ouvrirCoffre(contenus){
  return new Promise(res => {
    const v = panneau({ classe:"c-violet", titre:"Coffre mystère", corps:`
      <div id="cf-choix"><p class="texte-centre" style="margin-bottom:12px">Ouvrez un coffre.</p>
      <div class="trois">${["A","B","C"].map((l,k) => `<button class="piece c-violet" data-k="${k}"><b>${l}</b><small>coffre</small></button>`).join("")}</div></div>
      <div id="cf-res" hidden style="display:grid; gap:12px"></div>` });
    $$("[data-k]", v).forEach(b => b.onclick = () => {
      const t = appliquerCoffre(contenus[+b.dataset.k]);
      $("#cf-choix", v).hidden = true; const r = $("#cf-res", v); r.hidden = false;
      r.innerHTML = `<div class="case-speciale piece ${t.classe}">${esc(t.titre)}</div><p class="texte-centre">${t.texte}</p><button class="bouton piece c-jaune" id="cf-ok">Continuer</button>`;
      $("#cf-ok", v).focus(); $("#cf-ok", v).onclick = () => { v.remove(); res(); };
    });
  });
}
function ouvrirBoutique(onFerme){
  const v = panneau({ classe:"c-violet", titre:"Boutique", corps:`<div id="bq" style="display:grid; gap:12px"></div>` });
  const rendre = () => {
    $("#bq", v).innerHTML = `<p class="texte-centre">Banque : <b>${euros(P.banque)}</b></p>
      <div class="lignes">${[["indice","Indice","une solution commence par…",PRIX.indice],["passe","Passe","sans perdre de vie",PRIX.passe],["temps","+10 secondes","sur la prochaine carte",PRIX.temps]].map(([k,n,d,p]) =>
        `<div style="align-items:center"><span>${n}<br><small style="font-size:13px; color:var(--gris)">${d}</small></span><button class="bouton petit piece c-vert" data-k="${k}" ${P.banque<p?"disabled":""}>${p} €</button></div>`).join("")}</div>
      <p style="font-size:14px; color:var(--gris)">Vos jokers : ${P.indices} indice${P.indices>1?"s":""}, ${P.melanges===Infinity?"mélange illimité":P.melanges+" mélange"+(P.melanges>1?"s":"")}, ${P.passes} passe${P.passes>1?"s":""}.</p>
      <button class="bouton piece c-jaune" id="bq-ok">Fermer</button>`;
    $$("[data-k]", v).forEach(b => b.onclick = () => {
      const k = b.dataset.k, p = PRIX[k]; if(P.banque < p) return;
      P.banque -= p; if(k==="indice") P.indices++; if(k==="passe") P.passes++; if(k==="temps") P.tempsBonus++;
      Son.piece(); rendre();
    });
    $("#bq-ok", v).onclick = () => { v.remove(); onFerme && onFerme(); };
  };
  rendre();
}

function lancerManche(){
  const niv = P.parcours ? P.parcours[P.manche] : P.nivEntrainement;
  P.carte = P.parcours ? P.cartes[P.manche] : tirerCarte(niv, P.rnd, P.deja);
  if(window.QLN_CARTE_FORCEE){ P.carte = window.QLN_CARTE_FORCEE; window.QLN_CARTE_FORCEE = null; P.chrono = false; }
  Definitions.precharger(P.carte.mots);   // toutes les définitions de la carte en une requête, prêtes pour la face B
  const evt = P.evtCourant || null; P.evtCourant = null;
  const leg = !!P.legAccepte; P.legAccepte = false;
  const tf = (P.cfg && P.cfg.tf) || 1, gm = (P.cfg && P.cfg.gm) || 1;
  let duree = NIVEAUX[niv].temps*1000*tf;
  if(P.mode==="braquage") duree = P.reste;
  if(evt && evt.cle==="eclair") duree = Math.round(duree/2);
  if(evt && evt.cle==="temps") duree += 30000;
  if(P.tempsBonus){ duree += P.tempsBonus*10000; P.tempsBonus = 0; }
  const sm = P.regles.serie ? serieMult(P.serie) : 1;
  const mult = (evt ? evt.mult : 1) * (leg ? 3 : 1) * sm * gm;
  P.m = { trouves:[], indice:false, debut:performance.now(), duree, reste:duree, gain:0, base:0, premierA:null, fini:false,
    evt, legend:leg, mult, sm, gm, arcMax: P.mode==="braquage" ? Math.max(BRAQ_TEMPS, duree) : duree };
  ecranJeu();
  if(P.chrono) demarrerMinuteur();
  if(evt && evt.cle==="masque"){ const m = P.m; setTimeout(() => { if(P && P.m === m && !m.fini) $(".ecran")?.classList.add("masque"); }, 3000); }
}
function majInfos(){
  const z = $("#serie-info"); if(!z || !P) return;
  const parts = [];
  if(P.regles.serie) parts.push(`<span class="pastille-info">Cagnotte <b>${euros(P.cagnotte)}</b></span><span class="pastille-info mult">Série ${fmtMult(serieMult(P.serie))}</span>`);
  if(P.m && P.m.evt) parts.push(`<span class="pastille-info evt ${P.m.evt.classe}">${esc(P.m.evt.nom)}</span>`);
  if(P.m && P.m.legend) parts.push(`<span class="pastille-info evt c-noir">Légendaire ×3</span>`);
  if(P.ghost){ const k = P.manche, g = k>0 ? P.ghost.traj[k-1] : 0; parts.push(`<span class="pastille-info">${esc(P.ghost.nom)} <b>${euros(g)}</b></span>`); }
  z.innerHTML = parts.join("");
}
function ecranJeu(){
  const c = P.carte, n = norm(c.origine).length, nbSol = solutionsDe(c).length, brq = P.mode==="braquage";
  const piste = P.parcours ? `<div class="piste">${P.parcours.map((nv,i)=>{ const h=P.historique.filter(x=>!x.special)[i]; return `<i class="${NIVEAUX[nv].classe} ${h?(h.reussi?"fait":"rate"):(i===P.manche?"encours":"")}"></i>`; }).join("")}</div>` : "";
  app.innerHTML = `
  <section class="ecran" style="--tw:${largeurTuile(n, tuileMax())}px; --tc:${largeurTuile(n, Math.min(38, tuileMax()))}px">
    <div class="hud">
      <button class="icone-btn" id="b-quitter" aria-label="Quitter la partie">${ICO.croix}</button>
      <div class="hud-centre"><span class="hud-titre">${P.parcours ? `${brq?"Mot":"Carte"} ${P.manche+1} sur ${P.parcours.length}` : `Entraînement · carte ${P.historique.length+1}`}</span>${piste}</div>
      <div class="banque"><span class="piece-or">${brq?"★":"€"}</span><b id="banque">${brq ? P.mots+"/"+P.parcours.length : euros(P.banque)}</b></div>
    </div>
    ${P.parcours && !brq ? `<div class="vies" aria-label="${pluriel(P.vies,"vie")}" style="justify-content:center">${Array.from({length:P.viesMax},(_,i)=>pionSVG("#ffcf3a", i>=P.vies?"perdue":"")).join("")}</div>` : ""}
    <div class="serie-info" id="serie-info"></div>
    <div class="table-carte">${carteHTML(c, {chrono:P.chrono, inverse: !!(P.m.evt && P.m.evt.cle==="miroir"), indic:`<b>${pluriel(nbSol,"anagramme")}</b> à trouver`})}</div>
    <div id="compo">
      <div class="reponse" id="reponse" aria-live="polite"></div>
      <div class="message" id="message" role="status"></div>
      <div class="reserve" id="reserve"></div>
    </div>
    <div class="commandes">
      <button class="rond piece c-noir" id="b-effacer" aria-label="Effacer">${ICO.effacer}</button>
      <button class="rond piece c-noir" id="b-melanger" aria-label="Mélanger">${ICO.melanger}</button>
      <button class="bouton piece c-jaune" id="b-valider">Valider</button>
      <button class="rond piece c-violet" id="b-indice" aria-label="Indice">${ICO.indice}${P.parcours?`<small>${P.indices}</small>`:""}</button>
      <button class="rond piece c-noir" id="b-passer" aria-label="Passer la carte">${ICO.passer}</button>
    </div>
    <div class="legende-cmd" aria-hidden="true"><span>Effacer</span><span>Mélanger</span><span></span><span>Indice</span><span id="leg-passer">Passer</span></div>
    <div class="trouves" id="trouves"></div>
  </section>`;
  if(typeof Series !== "undefined") Series.habiller(c);
  P.compo = Composeur($("#compo"), c, { onComplet: () => valider(), onValider: () => valider(), onChange: () => message(""),
    avantMelanger: () => { if(P.melanges <= 0) return false; if(P.melanges !== Infinity){ P.melanges--; P.jokersUtilises++; majJokers(); } } });
  $("#b-quitter").onclick = confirmerQuitter;
  $("#b-effacer").onclick = () => P.compo.effacer();
  $("#b-melanger").onclick = () => P.compo.melanger();
  $("#b-indice").onclick = donnerIndice;
  $("#b-passer").onclick = passerCarte;
  $("#b-valider").onclick = valider;
  if(P.chrono) majChrono(P.m.reste, P.m.arcMax);
  majInfos(); majJokers();
  Pub.animerBandeau();
}
function passerCarte(){
  if(P.m.trouves.length) return finManche("fini");
  const double = P.m.evt && P.m.evt.cle==="double";
  if(P.parcours && P.passes > 0 && !double){ P.passes--; P.jokersUtilises++; return finManche("joker"); }
  finManche("passe");
}
function majJokers(){
  if(!P || !P.m) return;
  const mel = $("#b-melanger"), pas = $("#b-passer");
  if(mel){
    const fini = P.parcours && P.melanges !== Infinity;
    mel.disabled = P.m.fini || P.melanges <= 0;
    let s = $("small", mel);
    if(fini){ if(!s){ s = document.createElement("small"); mel.appendChild(s); } s.textContent = P.melanges; } else if(s) s.remove();
  }
  if(pas && P.parcours){
    const brq = P.mode==="braquage", double = P.m.evt && P.m.evt.cle==="double";
    pas.disabled = brq || P.m.fini;
    let s = $("small", pas);
    if(P.passes > 0 && !double && !brq){ if(!s){ s = document.createElement("small"); pas.appendChild(s); } s.textContent = P.passes; } else if(s) s.remove();
    const leg = $("#leg-passer"); if(leg && !P.m.trouves.length) leg.textContent = brq ? "—" : (P.passes>0 && !double ? "Passe" : "Passer");
  }
  majIndice();
}
function majTrouves(){
  $("#trouves").innerHTML = P.m.trouves.map(w=>`<button class="chip" data-def="${esc(w.toLowerCase())}">${esc(w)}</button>`).join("");
  const reste = solutionsDe(P.carte).length - P.m.trouves.length;
  $("#indic").innerHTML = reste>0 ? `Gagnée ! Encore <b>${pluriel(reste,"anagramme")}</b> en bonus` : "<b>Toutes les anagrammes trouvées !</b>";
  $("#leg-passer").textContent = "Suivante";
}
function majIndice(){
  const b = $("#b-indice"); if(!b) return;
  const double = P.m.evt && P.m.evt.cle==="double";
  b.disabled = P.m.indice || P.m.trouves.length>0 || (P.parcours && P.indices<=0) || double || P.m.fini;
  const s = $("small", b); if(s && P.parcours) s.textContent = P.indices;
}
function message(txt, cls=""){ const m=$("#message"); if(m){ m.textContent=txt; m.className="message "+cls; } }
function donnerIndice(){
  if(P.m.indice || P.m.trouves.length || (P.parcours && P.indices<=0) || (P.m.evt && P.m.evt.cle==="double")) return;
  if(P.parcours){ P.indices--; P.jokersUtilises++; }
  P.m.indice = true;
  const premiere = norm(solutionsDe(P.carte)[0])[0];
  P.compo.imposer(premiere);
  if(P.mode==="braquage"){ P.m.debut -= 10000; message(`Une solution commence par ${premiere}. −10 secondes.`, "info"); }
  else message(`Une solution commence par ${premiere}. Gain divisé par deux.`, "info");
  majJokers();
}
function crediter(g){
  if(P.regles.serie){ P.cagnotte += g; majInfos(); }
  else { const avant = P.banque; P.banque += g; compterVers($("#banque"), avant, P.banque); }
}
function valider(){
  if(P.m.fini) return;
  const compo = P.compo, n = compo.taille;
  if(!compo.complet){ message(`Utilisez les ${n} lettres.`, "ko"); compo.marquer("erreur"); Son.ko(); return; }
  const prop = compo.mot, c = P.carte;
  const raz = () => setTimeout(()=>{ if(P && !P.m.fini && P.compo===compo) compo.vider(); }, 650);
  const unique = P.m.evt && P.m.evt.cle==="double" && !P.m.trouves.length;
  const mc = P.m, rate = () => unique ? setTimeout(() => { if(P && P.m === mc && !mc.fini) finManche("essai"); }, 700) : raz();
  if(prop === norm(c.origine)){ message("C'est le mot de la carte. Cherchez-en un autre.", "ko"); compo.marquer("erreur"); Son.ko(); return rate(); }
  const mot = chercherMot(c, prop);
  if(!mot){
    compo.marquer("erreur"); Son.ko();
    if(unique){ message(`${prop} n'est pas dans le dictionnaire du jeu.`, "ko"); return rate(); }
    if(window.QLN_LANGUE_CARTE){ message(`${prop} n'est pas dans le dictionnaire du jeu.`, "ko"); return raz(); }
    Contestation.proposer(prop); return raz();
  }
  if(P.m.trouves.some(w=>norm(w)===prop)){ message("Déjà trouvé.", "ko"); compo.marquer("erreur"); return raz(); }
  accepterMot(mot, compo, raz);
}
/* crédite un mot trouvé (appelé par valider, ou après une contestation acceptée) */
function accepterMot(mot, compo, raz = () => {}){
  const c = P.carte;
  if(P.mode==="braquage") return braquageReussi(mot);
  const N = NIVEAUX[c.niv], ecoule = performance.now() - P.m.debut;
  let base;
  if(!P.m.trouves.length){
    base = N.gain;
    if(P.chrono && ecoule < P.m.duree/2) base += Math.round(N.gain*BONUS_RAPIDITE);
    if(P.m.indice) base = Math.round(base/2);
    P.m.premierA = ecoule;
  } else base = Math.round(N.gain*BONUS_EXTRA);
  const gain = Math.round(base * P.m.mult);
  P.m.base += base; P.m.gain += gain;
  P.m.trouves.push(mot.toUpperCase());
  Son.ok(); if(compo) compo.marquer("juste"); envolerGain(gain);
  message(P.m.trouves.length===1 ? `Bravo ! ${mot.toUpperCase()}` : `Bonus ! ${mot.toUpperCase()}`, "ok");
  crediter(gain);
  majTrouves(); majJokers();
  if(P.m.trouves.length === solutionsDe(c).length){ const mc = P.m; return setTimeout(() => { if(P && P.m === mc) finManche("fini"); }, 750); }   // seulement si c'est toujours la même carte
  raz();
}
function demarrerMinuteur(){
  arreterMinuteur(); let dernierTic = 99;
  const tick = () => {
    if(!P || P.m.fini) return;
    P.m.reste = Math.max(0, P.m.duree - (performance.now() - P.m.debut));
    majChrono(P.m.reste, P.m.arcMax || P.m.duree);
    const s = Math.ceil(P.m.reste/1000);
    if(s<=10 && s!==dernierTic && s>0){ dernierTic=s; Son.tic(s); }
    if(P.m.reste<=0) return finManche("temps");
    minuteur = requestAnimationFrame(tick);
  };
  minuteur = requestAnimationFrame(tick);
}
function arreterMinuteur(){ if(minuteur) cancelAnimationFrame(minuteur); minuteur=null; }

function finManche(raison){
  if(!P || !P.m || P.m.fini) return;   // la partie a pu être quittée entre-temps (minuteur en attente)
  P.m.fini = true; arreterMinuteur(); P.compo.bloquer(true); composeurActif = null; $(".ecran")?.classList.remove("masque");
  if(P.mode==="braquage") return finBraquage(false);
  const c = P.carte, N = NIVEAUX[c.niv], reussi = P.m.trouves.length>0, joker = raison==="joker";
  let perte = 0, cadeau = "";
  if(!reussi && !joker){
    if(P.parcours) P.vies--;
    Son.echec();
    if(P.regles.serie){ const avant = P.cagnotte; P.cagnotte = arr5(P.cagnotte/2); perte = avant - P.cagnotte; }
    P.serie = 0;
  }
  if(reussi){
    P.serie++;
    if(P.m.evt && P.m.evt.cle==="vie" && P.vies < P.viesMax){ P.vies++; cadeau = "Une vie regagnée !"; }
    if(P.regles.jokers && P.serie % 3 === 0){ const t = ["indices","melanges","passes"][Math.floor(Math.random()*3)]; P[t]++; cadeau += (cadeau ? " " : "") + `Trois réussites d'affilée : vous gagnez ${NOM_JOKER[t]}.`; }
  }
  P.historique.push({niv:c.niv, origine:c.origine, trouves:[...P.m.trouves], gain:P.m.gain, reussi, joker});
  if(typeof Progres !== "undefined") Progres.carte({niv:c.niv, reussi, nbTrouves:P.m.trouves.length, nbSol:solutionsDe(c).length, temps:P.m.premierA, chrono:P.chrono, indice:P.m.indice});
  P.traj.push(P.banque + P.cagnotte);
  const trouvesN = new Set(P.m.trouves.map(norm));
  const titre = reussi ? "Carte gagnée" : joker ? "Carte passée (joker)" : raison==="temps" ? "Sablier écoulé" : raison==="essai" ? "Un seul essai : raté" : "Carte passée";
  const fin = !!P.parcours && (P.vies<=0 || P.manche+1 >= P.parcours.length);

    <h3>Face B · toutes les solutions de ${esc(norm(c.origine))}</h3>
    <div class="solutions">${c.mots.map(w=>{ const n=norm(w); const cls = n===norm(c.origine)?"origine":(trouvesN.has(n)?"trouve":""); return `<button class="sol ${cls}" data-def="${esc(w)}">${esc(w)}</button>`; }).join("")}</div>

    ${lignes.length || P.regles.serie || P.parcours ? `<div class="lignes">${lignes.map(([l,val])=>`<div><span>${l}</span><b class="${val<0?"neg":""}">${val>0?"+":""}${euros(val)}</b></div>`).join("")}${P.regles.serie && !fin ? `<div><span>Cagnotte en cours</span><b>${euros(P.cagnotte)}</b></div>` : ""}<div class="total"><span>Banque</span><b id="total-banque">${euros(P.banque)}</b></div></div>` : ""}
    ${!reussi && !joker && P.parcours ? `<p class="texte-centre">${P.vies>0 ? `Une vie perdue. Il vous en reste ${P.vies}.` : "Plus de vie : la partie s'arrête."}${perte ? ` Vous perdez ${euros(perte)} de cagnotte.` : ""}</p>` : ""}
    ${cadeau ? `<p class="texte-centre" style="color:#2f7a1c">${cadeau}</p>` : ""}

  if(tuto) return;

}

/* ----- Le braquage : six mots de plus en plus longs, un chrono commun ----- */
const BRAQ_LONG = [5,6,7,8,9,10], BRAQ_TEMPS = 360000, BRAQ_PLUS = 20000;
let IDX_LONG = null;
function carteLongueur(L, rnd, deja){
  if(!IDX_LONG){ IDX_LONG = {}; for(const niv of Object.keys(DICO)) for(const g of DICO[niv]){ const l = norm(g[0]).length; (IDX_LONG[l] = IDX_LONG[l] || []).push({niv, g}); } }
  const liste = IDX_LONG[L];
  for(let e=0; e<80; e++){ const {niv, g} = liste[Math.floor(rnd()*liste.length)], k = cleTri(g[0]); if(deja.has(k)) continue; deja.add(k); return {niv, origine:g[rnd() < .6 ? 0 : 1], mots:g, cle:k}; }
  const {niv, g} = liste[0]; return {niv, origine:g[0], mots:g, cle:cleTri(g[0])};
}
function nouveauBraquage(){
  arreterVitrine();
  Pub.avantPartie().then(() => {
    const deja = new Set(), cartes = BRAQ_LONG.map(L => carteLongueur(L, Math.random, deja));
    P = { mode:"braquage", rnd:Math.random, cfg:null, regles:{...REGLES_NULLES}, cartes, parcours:cartes.map(c => c.niv), chrono:true,
      manche:0, banque:0, cagnotte:0, serie:0, vies:3, viesMax:3, indices:2, melanges:Infinity, passes:0, tempsBonus:0, jokersUtilises:0, pubsRecompense:0,
      deja, historique:[], carte:null, evenements:{}, evts:{}, coffres:{}, legendaire:null, traj:[], ghost:null, reste:BRAQ_TEMPS, mots:0 };
    lancerManche();
  });
}
function braquageReussi(mot){
  const compo = P.compo; P.m.fini = true; arreterMinuteur();
  P.m.trouves.push(mot.toUpperCase()); P.mots++;
  const rest = Math.max(0, P.m.duree - (performance.now() - P.m.debut));
  Son.ok(); compo.marquer("juste"); compo.bloquer(true);
  message(`Bravo ! ${mot.toUpperCase()}${P.manche < BRAQ_LONG.length-1 ? " · +20 s" : ""}`, "ok");
  const b = $("#banque"); if(b) b.textContent = P.mots+"/"+P.parcours.length;
  P.historique.push({niv:P.carte.niv, origine:P.carte.origine, trouves:[...P.m.trouves], gain:0, reussi:true});
  setTimeout(() => {
    if(!P || P.mode!=="braquage") return;
    if(P.manche >= BRAQ_LONG.length-1){ P.restFinal = rest; return finBraquage(true); }
    P.reste = rest + BRAQ_PLUS; P.manche++; lancerManche();
  }, 900);
}
function finBraquage(ok){
  arreterMinuteur(); composeurActif = null;
  const reste = ok ? P.restFinal : 0, st = store.get("braquage", {meilleur:0});
  let record = false; if(ok && reste > (st.meilleur||0)){ st.meilleur = reste; store.set("braquage", st); record = true; }

  app.innerHTML = `

    <div class="recap">${P.historique.map(h => `<div class="recap-l"><span class="pastille piece ${NIVEAUX[h.niv].classe}">${h.reussi?"✓":"✕"}</span><span><span data-def="${esc(h.origine)}">${esc(norm(h.origine))}</span> → ${h.trouves.length ? h.trouves.map(w=>`<span data-def="${esc(w.toLowerCase())}">${esc(w)}</span>`).join(", ") : "<i>non trouvé</i>"}</span><b>${norm(h.origine).length} lettres</b></div>`).join("")}</div>
    ${Pub.bandeau("grand")}
    <div class="duo"><button class="bouton piece c-vert" id="b-rejouer">Rejouer</button><button class="bouton piece c-noir" id="b-menu">Solo</button></div>
  </section>`;
  if(ok){ Son.fin(); setTimeout(() => confettis(record ? 180 : 100), 300); } else Son.echec();
  $("#b-menu").onclick = ecranSolo; $("#b-rejouer").onclick = nouveauBraquage;
  if(typeof Progres !== "undefined") Progres.finPartie({mode:"braquage", braquageOk:ok, total: ok ? Math.round(reste/1000) : 0});

function partager(){
  if(typeof Progres !== "undefined"){ const rec = store.get("records", {}); return Progres.partagerTexte(P.ligneJour || (rec.jourLigne && rec.jourLigne[aujourdhui()])); }
  const d = String(aujourdhui());
  const ligne = P.historique.filter(h=>!h.special).map(h => h.reussi ? {v:"🟩",b:"🟦",r:"🟥",n:"⬛"}[h.niv] : "⬜").join("");
  const nb = P.banque>=1500?3 : P.banque>=800?2 : P.banque>=300?1 : 0;
  const txt = `Le-QLN · Défi du jour ${d.slice(6)}/${d.slice(4,6)}\n${ligne}\n${euros(P.banque)} ${"★".repeat(nb)}`;
  try{ navigator.clipboard.writeText(txt).then(()=>toast("Résultat copié : collez-le où vous voulez."), ()=>toast(txt, 6000)); }catch(e){ toast(txt, 6000); }
}

function confirmerQuitter(){
  const pause = P.chrono && !P.m.fini;
  if(pause) arreterMinuteur();
  const v = panneau({ classe:"c-orange", titre:"Quitter la partie ?", corps:`<p class="texte-centre">La partie en cours sera perdue.</p>
    <div class="duo"><button class="bouton piece c-noir" id="q-non">Continuer</button><button class="bouton piece c-rouge" id="q-oui">Quitter</button></div>` });

  $("#q-non",v).onclick = () => { v.remove(); if(pause){ P.m.debut += performance.now()-t0; demarrerMinuteur(); } };
  $("#q-oui",v).onclick = () => { v.remove(); ecranAccueil(); };
}

  // grandes lettres fantômes sur les bords (comme sur le visuel) et étincelles dorées
  [["Q", 3, 33, -14, 120], ["N", 13, 54, -16, 110], ["B", 10, 80, -18, 90], ["D", 72, 4, -14, 120], ["R", 92, 16, 8, 80], ["L", 88, 66, -8, 110]].forEach(([c, x, y, r, t], i) => {
    const l = document.createElement("span"); l.className = "lf"; l.textContent = c;
    l.style.cssText = `left:${x}%; top:${y}%; font-size:${t}px; --t:${t}px; --r:${r}deg; animation-delay:${-i*1.7}s`; sc.appendChild(l); });
  [[4,20,1],[8,82,1],[16,7,0],[20,44,0],[29,12,0],[7,54,0],[2,66,0],[87,14,1],[95,8,0],[60,12,0],[98,43,0],[80,62,0],[97,78,1],[70,85,0],[28,82,0],[46,90,0],[56,4,0],[38,35,0]].forEach(([x, y, croix], i) => {

    e.style.cssText = `left:${x}%; top:${y}%; animation-duration:${2.2 + (i*0.7)%3}s; animation-delay:${-(i*0.9)%4}s; ${croix ? "" : `transform:scale(${.5 + (i%3)*.25})`}`; sc.appendChild(e); });
  if(!reduit){
    const L = "ABCDEILNOQRSTU";
    for(let i=0;i<12;i++){ const g = document.createElement("span"); g.className = "gh"; g.textContent = L[(i*7+3)%L.length];
      g.style.cssText = `left:${(i*83)%96}%; font-size:${34+(i*17)%60}px; animation-duration:${26+(i*5)%22}s; animation-delay:${-(i*4.3)%30}s; --o:${.035+(i%4)*.012}; --r0:${-20+(i*13)%40}deg; --r1:${-60+(i*29)%120}deg; --dx:${-40+(i*23)%80}px`; sc.appendChild(g); }
    for(let i=0;i<14;i++){ const o = document.createElement("i"); o.className = "or";

  }
  document.body.prepend(sc);
  /* inclinaison 3D + reflet suivant la souris (écrans avec souris) */
  if(matchMedia("(hover:hover)").matches && !reduit){
    document.addEventListener("pointermove", e => {
      const m = e.target.closest && e.target.closest(".mode"); 
      document.querySelectorAll(".mode.inclinee").forEach(x => { if(x !== m){ x.classList.remove("inclinee"); x.style.transform = ""; } });
      if(!m) return; const r = m.getBoundingClientRect(), x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
      m.classList.add("inclinee"); m.style.setProperty("--mx", x*100+"%"); m.style.setProperty("--my", y*100+"%");

  /* ordinateur : un écran un peu trop haut est réduit (zoom) pour tenir sans défilement ; les écrans vraiment longs

  if("zoom" in document.documentElement.style){
    const appEl = document.getElementById("app"); let tz = null, calme = 0;
    const ajusterZoom = () => {
      appEl.style.zoom = ""; appEl.style.minHeight = "";
      if(innerWidth < 1000 || innerHeight < 480) return;
      const e = appEl.querySelector(".ecran"); if(!e || e.classList.contains("plateau-ecran") || e.classList.contains("accueil")) return;
      let z = 1;
      for(let passe = 0; passe < 3; passe++){   // le zoom ne réduit pas tout exactement en proportion : on affine
        const depasse = document.documentElement.scrollHeight - innerHeight;
        if(depasse <= 0) break;
        const h = appEl.getBoundingClientRect().height;
        z = z * (h - depasse - 4) / h;
        if(z < .55){ z = 1; break; }             // trop petit pour rester lisible : on laisse défiler
        appEl.style.zoom = (Math.floor(z*1000)/1000).toString(); appEl.style.minHeight = "0";   // (la hauteur minimale, en pourcentage, n'est pas réduite par le zoom)
      }

      calme = Date.now() + 500;
    };
    let tz2 = null, tz3 = null;
    const demander = () => { clearTimeout(tz); clearTimeout(tz2); clearTimeout(tz3); tz = setTimeout(ajusterZoom, 40); tz2 = setTimeout(ajusterZoom, 450); tz3 = setTimeout(ajusterZoom, 1300); };   // (certains écrans se complètent juste après l'affichage)
    new MutationObserver(demander).observe(appEl, {childList:true});
    // l'écran grandit en cours de route (mots trouvés sous les boutons, messages…) : on réajuste, sans boucler sur nos propres changements
    if(window.ResizeObserver){ const ro = new ResizeObserver(() => { if(Date.now() > calme){ clearTimeout(tz); tz = setTimeout(() => { ajusterZoom(); calme = Date.now() + 500; }, 120); } }); ro.observe(appEl); }
    addEventListener("resize", demander); demander();
  }
  /* vibrations légères (mobiles) */
  if(typeof Son !== "undefined" && navigator.vibrate){
    const v = {tap:4, ok:[8,35,8], ko:[25], piece:5};   // impulsions courtes : vibration douce
    for(const k in v){ const f = Son[k]; if(typeof f === "function") Son[k] = function(){ try{ if(Son.actif && store.get("vibrations", true)) navigator.vibrate(v[k]); }catch(e){} return f.apply(this, arguments); }; }

    .observe(document.body, {childList:true, subtree:true, characterData:true});
})();
</script>

<script>
/* =====================  Ergonomie appli : bouton retour Android, mise en veille, écran allumé  ===================== */
(function(){
  /* 1. Bouton « retour » du téléphone : au lieu de fermer l'appli, il agit comme le bouton retour / quitter de l'écran */
  const armer = () => { try{ history.pushState({qln:1}, ""); }catch(e){} };
  armer();
  addEventListener("popstate", () => {
    const q = document.querySelector(".voile #q-non");                 // dialogue « Quitter ? » ouvert → Continuer
    const voile = [...document.querySelectorAll(".voile")].pop();
    const retour = document.getElementById("b-retour"), quitter = document.getElementById("b-quitter");
    if(q){ q.click(); armer(); return; }
    if(voile && !quitter && !voile.classList.contains("pub-voile")){ voile.remove(); armer(); return; }   // panneau d'information hors partie → fermé
    if(quitter){ quitter.click(); armer(); return; }
    if(retour){ retour.click(); armer(); return; }
    // accueil : on laisse le retour fermer l'appli (comportement attendu)
  });

  /* 2. Appli mise en arrière-plan pendant un sablier : pause automatique (dialogue Continuer / Quitter) */
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState !== "hidden") return;
    if(document.querySelector(".voile #q-oui")) return;                 // déjà en pause
    const enJeu = document.querySelector(".reserve") && document.getElementById("b-quitter");
    if(enJeu && typeof P !== "undefined" && P && P.chrono && P.m && !P.m.fini) document.getElementById("b-quitter").click();
  });

  /* 3. Écran maintenu allumé pendant une partie (sabliers jusqu'à 3 min) */
  let verrou = null;
  const majVerrou = async () => {
    const enPartie = !!document.getElementById("b-quitter") && document.visibilityState === "visible";
    try{
      if(enPartie && !verrou && navigator.wakeLock){ verrou = await navigator.wakeLock.request("screen"); verrou.addEventListener("release", () => { verrou = null; }); }
      else if(!enPartie && verrou){ await verrou.release(); verrou = null; }
    }catch(e){ verrou = null; }
  };
  new MutationObserver(majVerrou).observe(document.getElementById("app"), {childList:true});
  document.addEventListener("visibilitychange", majVerrou);
})();
</script>
