<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Le-QLN</title>
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Barlow Condensed"; font-weight:700; src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed"; font-weight:800; src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow"; font-weight:400; src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow"; font-weight:600; src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow"; font-weight:700; src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
:root{--fond:#071640; --carte:#0e2462; --carte2:#132e78; --ligne:rgba(255,255,255,.1); --texte:#eef3ff; --brume:#a9b8dc; --or:#ffd84a; --vert:#5fd068; --rouge:#ff6b6b}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #1c46b8, var(--fond) 60%) fixed; color:var(--texte); font:400 15px/1.45 Barlow, system-ui, sans-serif}
header{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px; padding:12px 20px; background:rgba(5,14,40,.9); backdrop-filter:blur(8px); border-bottom:1px solid rgba(255,216,74,.35)}
header h1{margin:0; font:800 24px "Barlow Condensed", sans-serif; letter-spacing:.06em; color:var(--or)}
header .qui{margin-left:auto; color:var(--brume); font-size:13px}
nav{display:flex; gap:6px; flex-wrap:wrap; padding:12px 20px 0; max-width:1200px; margin:0 auto}
nav button{border:0; cursor:pointer; padding:9px 14px; border-radius:10px; background:rgba(255,255,255,.06); color:var(--brume); font:700 15px Barlow, sans-serif}
nav button[aria-selected="true"]{background:var(--or); color:#2a1a00}
nav button .n{display:inline-block; min-width:20px; margin-left:6px; padding:0 6px; border-radius:9px; background:var(--rouge); color:#fff; font-size:12px}
main{max-width:1200px; margin:0 auto; padding:16px 20px 60px; display:grid; gap:16px}
.grille{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px}
.tuile{padding:14px 16px; border-radius:14px; background:var(--carte); box-shadow:inset 0 0 0 1px var(--ligne)}
.tuile b span{font:inherit; color:inherit} .tuile b span.ok{color:var(--vert)} .tuile b span.ko{color:var(--rouge)}
.grille.large{grid-template-columns:repeat(auto-fill, minmax(320px, 1fr))}
.tuile b{display:block; font:800 32px/1.05 "Barlow Condensed", sans-serif; color:#fff} .tuile span{color:var(--brume); font-size:13px; font-weight:600}
.tuile small{display:block; color:var(--brume); font-size:12.5px; margin-top:2px}
.bloc{padding:16px; border-radius:16px; background:rgba(3,10,30,.5); box-shadow:inset 0 0 0 1px var(--ligne)}
.bloc h2{margin:0 0 10px; font:800 20px "Barlow Condensed", sans-serif; letter-spacing:.05em; color:var(--or); text-transform:uppercase}
table{width:100%; border-collapse:collapse; font-size:14px} th,td{padding:7px 8px; text-align:left; border-bottom:1px solid var(--ligne); vertical-align:top}
th{color:var(--brume); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em}
td.n{text-align:right; font-variant-numeric:tabular-nums}
.pile{white-space:pre-wrap; font:12px ui-monospace, monospace; color:#c9d6ff; background:rgba(0,0,0,.3); padding:8px; border-radius:8px; margin-top:6px; max-height:180px; overflow:auto}
button.b{border:0; cursor:pointer; padding:8px 14px; border-radius:10px; font:700 14px Barlow, sans-serif; background:var(--carte2); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,216,74,.4)}
button.b.rouge{background:#6b1620} button.b.or{background:var(--or); color:#2a1a00}
input.champ{padding:9px 12px; border-radius:10px; border:0; background:rgba(255,255,255,.08); color:#fff; font:600 15px Barlow, sans-serif; min-width:240px}
.vide{color:var(--brume); padding:12px 0}
.message{max-width:560px; margin:60px auto; text-align:center} .message a{color:var(--or)}
.barres{display:flex; align-items:flex-end; gap:3px; height:150px; padding-top:10px} .barres div{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:1px; height:100%}
.barres i{display:block; border-radius:3px 3px 0 0; min-height:0} .barres i.a{background:#5fb3ff} .barres i.b{background:var(--or)}
.legende{display:flex; gap:16px; color:var(--brume); font-size:13px; margin-top:8px} .legende i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px}
.etiquettes{display:flex; justify-content:space-between; color:var(--brume); font-size:11.5px; margin-top:4px}
.ok{color:var(--vert)} .ko{color:var(--rouge)}
.bloc h3{margin:12px 0 6px; font:700 14px Barlow, sans-serif; color:var(--brume); text-transform:uppercase; letter-spacing:.05em}
.br{display:grid; grid-template-columns:minmax(110px, 38%) 1fr auto; align-items:center; gap:10px; margin:5px 0; font-size:14px}
.br i{display:block; height:12px; border-radius:6px; background:linear-gradient(90deg, #e0b52a, var(--or))} .br b{font-variant-numeric:tabular-nums}
.br.tunnel{grid-template-columns:minmax(150px, 28%) 1fr auto minmax(0, 200px); font-size:15px} .br.tunnel i{height:20px} .br em{font-style:normal; color:var(--brume); font-size:12.5px}
.jvm-tooltip{position:absolute; display:none; background:#0e2462; color:#fff; border:1px solid var(--or); border-radius:8px; padding:4px 8px; font:12px system-ui; z-index:999; pointer-events:none} .jvm-tooltip.active{display:block}
.jvm-container{position:relative; overflow:hidden; width:100%; height:100%}
.outils{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
@media (max-width:640px){ th:nth-child(n+5), td:nth-child(n+5){display:none} }
</style>
</head>
<body>
<header><h1>LE-QLN · ADMINISTRATION</h1><span class="qui" id="qui"></span><a href="./" style="color:var(--or); font-weight:700; text-decoration:none">← Le jeu</a></header>
<nav id="onglets" role="tablist"></nav>
<main id="main"><p class="vide">Chargement…</p></main>
<script src="config.js"></script>
<script>
/* Page d'administration de Le-QLN : réservée aux comptes listés dans la variable ADMIN_EMAILS du serveur (Render).
   On se connecte d'abord dans le jeu (Mon compte) ; la page réutilise cette connexion (même site, même navigateur). */
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const API = String(window.QLN_API_URL || "").replace(/\/$/, "");
const session = (() => { for(const k of ["qln:session", "qln-en:session"]){ try{ const s = JSON.parse(localStorage.getItem(k) || "null"); if(s && s.jeton) return s; }catch(e){} } return null; })();
const nb = n => Number(n || 0).toLocaleString("fr-FR");
const date = d => d ? new Date(d).toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit"}) : "—";
const depuis = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 3600 ? Math.round(s/60) + " min" : s < 86400 ? Math.round(s/3600) + " h" : Math.round(s/86400) + " j"; };
async function api(chemin, methode = "GET", corps){
  const r = await fetch(API + "/api" + chemin, {method:methode, headers:{Authorization:"Bearer " + session.jeton, ...(corps ? {"Content-Type":"application/json"} : {})}, body:corps ? JSON.stringify(corps) : undefined});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(d.erreur || "Serveur injoignable."), {status:r.status});
  return d;
}
function message(html){ $("#onglets").innerHTML = ""; $("#main").innerHTML = `<div class="message bloc">${html}</div>`; }

const ONGLETS = {tableau:"Tableau de bord", visites:"Visites", journal:"Journal des visites", tunnel:"Tunnel", erreurs:"Erreurs", joueurs:"Joueurs", mots:"Mots ajoutés", rappels:"Rappels"};
const PAYS_NOM = (() => { try{ const d = new Intl.DisplayNames(["fr"], {type:"region"}); return c => c && c !== "?" ? (d.of(c) || c) : "Inconnu"; }catch(e){ return c => c; } })();
const duree = s => { s = Math.round(+s || 0); return s < 60 ? s + " s" : s < 3600 ? Math.floor(s/60) + " min " + String(s%60).padStart(2, "0") : Math.floor(s/3600) + " h " + String(Math.floor(s%3600/60)).padStart(2, "0"); };
const heure = d => new Date(d).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
const ETAPES_NOM = {"page:site":"page (FR)", "page:en":"page (EN)", "tuto:debut":"partie guidée lancée", "tuto:fin":"partie guidée terminée", "compte:inscription":"compte créé", "compte:connexion":"connexion",
  "multi:salon":"salon créé", "multi:rejoindre":"salon rejoint", "rappels":"rappels activés", "parrain:partage":"lien d'invitation partagé", "installation":"jeu installé"};
const nomEtape = e => ETAPES_NOM[e] || (e.startsWith("partie:") ? "partie " + e.slice(7) : e.startsWith("fin:") ? "fin " + e.slice(4) : e.startsWith("tuto:stop") ? "partie guidée arrêtée (étape " + e.slice(9) + ")" : e);
const barres = (lignes, cle, lib) => { const mx = Math.max(1, ...lignes.map(x => x.n)); return lignes.map(x => `<div class="br"><span>${esc(lib ? lib(x[cle]) : x[cle])}</span><i style="width:${Math.max(2, 100*x.n/mx)}%"></i><b>${nb(x.n)}</b></div>`).join("") || `<p class="vide">Rien pour l'instant.</p>`; };
function carteMonde(geo){
  const el = document.getElementById("carte"); if(!el) return;
  const valeurs = {}; geo.forEach(x => { if(/^[A-Z]{2}$/.test(x.cle)) valeurs[x.cle] = x.n; });
  const go = () => { try{ el.innerHTML = ""; new jsVectorMap({selector:"#carte", map:"world", zoomButtons:false, backgroundColor:"transparent",
      regionStyle:{initial:{fill:"#1d3a86", stroke:"#071640", strokeWidth:.4}, hover:{fillOpacity:.85}},
      series:{regions:[{attribute:"fill", scale:{a:"#7a6420", b:"#b8921f", c:"#e0b52a", d:"#ffd84a"}, values:Object.fromEntries(Object.entries(valeurs).map(([k, v]) => { const mx = Math.max(...Object.values(valeurs)); const r = v/mx; return [k, r > .66 ? "d" : r > .33 ? "c" : r > .1 ? "b" : "a"]; }))}]},
      onRegionTooltipShow:(e, t, code) => t.text(t.text() + " : " + (valeurs[code] || 0) + " visiteur(s)")}); }catch(e){ el.innerHTML = `<p class="vide">Carte indisponible.</p>`; } };
  if(window.jsVectorMap) return go();
  const a = document.createElement("script"); a.src = "https://cdnjs.cloudflare.com/ajax/libs/jsvectormap/1.5.0/js/jsvectormap.min.js";
  a.onload = () => { const b = document.createElement("script"); b.src = "https://cdnjs.cloudflare.com/ajax/libs/jsvectormap/1.5.0/maps/world.min.js"; b.onload = go; b.onerror = go; document.head.appendChild(b); };
  a.onerror = go; document.head.appendChild(a);
}
let actuel = location.hash.slice(1) in ONGLETS ? location.hash.slice(1) : "tableau", resume = null;
function onglets(){
  $("#onglets").innerHTML = Object.entries(ONGLETS).map(([k, t]) => `<button role="tab" data-o="${k}" aria-selected="${k === actuel}">${t}${k === "erreurs" && resume && resume.erreurs.recentes ? `<span class="n">${resume.erreurs.recentes}</span>` : ""}</button>`).join("");
  document.querySelectorAll("#onglets button").forEach(b => b.onclick = () => { actuel = b.dataset.o; location.hash = actuel; afficher(); });
}
async function afficher(){
  onglets(); const m = $("#main"); m.innerHTML = `<p class="vide">Chargement…</p>`;
  try{ m.innerHTML = await VUES[actuel](); BRANCHER[actuel] && BRANCHER[actuel](); }
  catch(e){ m.innerHTML = `<div class="bloc ko">${esc(e.message)}</div>`; }
}
const tuile = (v, l, s) => `<div class="tuile"><b>${v}</b><span>${l}</span>${s ? `<small>${s}</small>` : ""}</div>`;
const VUES = {
  async tableau(){
    resume = await api("/admin/resume"); onglets();
    const {joueurs:j, scores:s, mots, erreurs:e, parrainage:p, rappels:r, serveur:v, pays} = resume;
    const {jours} = await api("/admin/activite");
    const max = Math.max(1, ...jours.map(x => Math.max(x.vus, x.scores)));
    return `
    <div class="grille">
      ${resume.visites ? tuile(nb(resume.visites.aujourdhui), "Visiteurs aujourd'hui", `${nb(resume.visites.semaine)} sur 7 jours · durée moyenne ${duree(resume.visites.duree)}`) : ""}
      ${tuile(nb(j.total), "Comptes", `+${nb(j.nouveaux_24h)} en 24 h · +${nb(j.nouveaux_7j)} en 7 j`)}
      ${tuile(nb(j.actifs_24h), "Actifs 24 h", `${nb(j.actifs_7j)} sur 7 j · ${nb(j.actifs_30j)} sur 30 j`)}
      ${tuile(nb(s.jour_aujourdhui), "Défis du jour aujourd'hui", `${nb(s.scores_24h)} scores en 24 h`)}
      ${tuile(nb(s.scores_7j), "Scores sur 7 jours", `Défi ${nb(s.defi_7j)} · Braquage ${nb(s.braquage_7j)} · Festival ${nb(s.festival_7j)}`)}
      ${tuile(nb(p.filleuls), "Amis parrainés", `${nb(p.parrains)} parrain(s)`)}
      ${tuile(r ? nb(r.abonnes) : "—", "Abonnés aux rappels", r ? `jour ${nb(r.jour)} · semaine ${nb(r.semaine)} · EN ${nb(r.anglais)}` : "")}
      ${tuile(nb(mots.total), "Mots ajoutés (contestations)", `${nb(mots.recents)} sur 7 j`)}
      ${tuile(`<span class="${e.recentes ? "ko" : "ok"}">${nb(e.distinctes)}</span>`, "Erreurs distinctes", `${nb(e.total)} occurrences · ${nb(e.recentes)} sur 24 h`)}
    </div>
    <div class="bloc"><h2>Activité sur 30 jours</h2>
      <div class="barres">${jours.map(x => `<div title="${x.jour} : ${x.vus} joueur(s) vu(s), ${x.scores} score(s), ${x.inscriptions} inscription(s)"><i class="b" style="height:${100*x.scores/max}%"></i><i class="a" style="height:${100*x.vus/max}%"></i></div>`).join("")}</div>
      <div class="etiquettes"><span>${jours[0].jour.slice(5).split("-").reverse().join("/")}</span><span>aujourd'hui</span></div>
      <div class="legende"><span><i style="background:#5fb3ff"></i>joueurs connectés vus</span><span><i style="background:var(--or)"></i>scores envoyés</span></div></div>
    <div class="grille large">
      <div class="bloc"><h2>Pays</h2><table>${pays.map(x => `<tr><td>${esc(x.pays)}</td><td class="n">${nb(x.n)}</td></tr>`).join("")}</table></div>
      <div class="bloc"><h2>Serveur</h2><table>
        <tr><td>En service depuis</td><td class="n">${depuis(v.depuis)}</td></tr>
        <tr><td>Salons ouverts / connectés</td><td class="n">${nb(v.salons)} / ${nb(v.clients)}</td></tr>
        <tr><td>Mémoire</td><td class="n">${nb(v.memoire)} Mo</td></tr>
        <tr><td>Base de données</td><td class="n">${(v.base/1048576).toFixed(1).replace(".", ",")} Mo / 256</td></tr>
        <tr><td>Node</td><td class="n">${esc(v.node)}</td></tr>
        <tr><td>Rappels</td><td class="n ${r && r.actif ? "ok" : "ko"}">${r && r.actif ? "actifs" : "inactifs"}</td></tr></table></div>
    </div>`;
  },
  async erreurs(){
    const {erreurs} = await api("/admin/erreurs");
    if(!erreurs.length) return `<div class="bloc"><h2>Erreurs</h2><p class="vide ok">Aucune erreur remontée. 🎉</p></div>`;
    return `<div class="bloc"><h2>Erreurs rencontrées par les joueurs</h2>
      <div class="outils"><button class="b rouge" id="tout-effacer">Tout effacer (après correction)</button><span class="vide">Une ligne = un même message au même endroit. Cliquez pour voir le détail.</span></div>
      <table><tr><th>Message</th><th>Nombre</th><th>Dernière</th><th>Fichier</th><th>Version</th><th>Écran</th><th></th></tr>
      ${erreurs.map(x => `<tr><td><details><summary>${esc(x.message)}</summary>${x.pile ? `<div class="pile">${esc(x.pile)}</div>` : ""}<div class="vide">Première fois : ${date(x.premiere)} · ${x.natif ? "appli" : "navigateur"} · ${esc(x.langue)} · ${esc(x.agent)}</div></details></td>
        <td class="n">${nb(x.nombre)}</td><td>${depuis(x.derniere)}</td><td>${esc(x.source)}${x.ligne ? ":" + x.ligne : ""}</td><td>${esc(x.version)}</td><td>${esc(x.ecran)}</td>
        <td><button class="b" data-effacer="${x.id}" title="Effacer">✕</button></td></tr>`).join("")}</table></div>`;
  },
  async joueurs(q = ""){
    const {joueurs} = await api("/admin/joueurs?q=" + encodeURIComponent(q));
    return `<div class="bloc"><h2>Joueurs (100 derniers vus)</h2>
      <div class="outils"><input class="champ" id="recherche" placeholder="Pseudo ou e-mail" value="${esc(q)}"><button class="b" id="chercher">Chercher</button></div>
      <table><tr><th>Pseudo</th><th>E-mail</th><th>Pays</th><th>XP</th><th>Scores</th><th>Inscrit</th><th>Vu</th><th>Parrain</th></tr>
      ${joueurs.map(x => `<tr><td>${esc(x.pseudo)}</td><td>${esc(x.email || (x.google ? "Google" : "—"))}</td><td>${esc(x.pays || "—")}</td><td class="n">${nb(x.xp)}</td><td class="n">${nb(x.scores)}</td><td>${date(x.cree_le)}</td><td>${depuis(x.vu_le)}</td><td>${esc(x.parrain || "")}</td></tr>`).join("") || `<tr><td colspan="8" class="vide">Aucun joueur.</td></tr>`}</table></div>`;
  },
  async mots(){
    const {mots} = await api("/admin/mots");
    return `<div class="bloc"><h2>Mots ajoutés après contestation</h2><p class="vide">Vérifiés dans le Wiktionnaire puis acceptés dans le jeu. Retirez ceux qui ne conviennent pas (ils redeviennent refusés).</p>
      <table><tr><th>Mot</th><th>Langue</th><th>Nature</th><th>Par</th><th>Le</th><th></th></tr>
      ${mots.map(x => `<tr><td><b>${esc(x.mot)}</b></td><td>${esc(x.langue)}</td><td>${esc(x.nature || "")}</td><td>${esc(x.pseudo || "anonyme")}</td><td>${date(x.cree_le)}</td><td><button class="b rouge" data-mot="${x.id}">Retirer</button></td></tr>`).join("") || `<tr><td colspan="6" class="vide">Aucun mot ajouté.</td></tr>`}</table></div>`;
  },
  async visites(){
    const v = await api("/admin/visites");
    const per = (x, t) => tuile(nb(x.visiteurs), t, `${nb(x.pages)} pages · durée moyenne ${duree(x.duree)} · médiane ${duree(x.mediane)}`);
    const mx = Math.max(1, ...v.jours.map(x => x.visiteurs));
    const sansStats = (() => { try{ return localStorage.getItem("qln-sans-stats") === "1"; }catch(e){ return false; } })();
    return `
    <div class="grille">${per(v.jour, "Visiteurs aujourd'hui")}${per(v.semaine, "Visiteurs sur 7 jours")}${per(v.mois, "Visiteurs sur 30 jours")}${per(v.an, "Visiteurs sur 12 mois")}</div>
    <div class="bloc"><h2>Visiteurs par jour · 60 jours</h2>
      <div class="barres">${v.jours.map(x => `<div title="${x.jour} : ${x.visiteurs} visiteur(s) dont ${x.nouveaux} nouveau(x), ${x.pages} page(s)"><i class="b" style="height:${100*(x.visiteurs - x.nouveaux)/mx}%"></i><i class="a" style="height:${100*x.nouveaux/mx}%"></i></div>`).join("")}</div>
      <div class="etiquettes"><span>${v.jours[0].jour.slice(5).split("-").reverse().join("/")}</span><span>aujourd'hui</span></div>
      <div class="legende"><span><i style="background:#5fb3ff"></i>nouveaux visiteurs</span><span><i style="background:var(--or)"></i>visiteurs qui reviennent</span></div></div>
    <div class="bloc"><h2>Origine des visiteurs · 30 jours</h2>
      <div id="carte" style="height:340px"></div>
      <div class="grille large" style="margin-top:12px">
        <div><h3>Pays</h3>${barres(v.pays.slice(0, 15), "cle", PAYS_NOM)}</div>
        <div><h3>Sites d'origine</h3>${barres(v.sources.filter(x => x.cle !== "?").slice(0, 12), "cle")}<p class="vide">${nb((v.sources.find(x => x.cle === "?") || {}).n)} visiteur(s) venus directement (adresse tapée, favori, appli).</p></div>
        <div><h3>Appareils</h3>${barres(v.appareils, "cle")}<h3>Langues</h3>${barres(v.langues.slice(0, 8), "cle")}</div>
        <div><h3>Appli ou navigateur</h3>${barres([{cle:"applis Android / iOS", n:v.natif.appli}, {cle:"navigateur", n:v.natif.web}, {cle:"connectés à un compte", n:v.natif.connectes}], "cle")}</div>
      </div>
      <p class="vide">Pays : d'après Cloudflare quand il le donne, sinon la région de la langue du navigateur. ${nb(v.robots)} passage(s) de robots écartés sur 30 jours. Appareils exclus : ${nb(v.exclus)}.
        ${sansStats ? `<b class="ok">Cet appareil n'est pas compté.</b>` : `<button class="b" id="exclure">Ne plus compter cet appareil</button>`}</p></div>`;
  },
  async journal(jour){
    jour = jour || new Date().toISOString().slice(0, 10);
    const j = await api("/admin/journal?jour=" + jour);
    return `<div class="bloc"><h2>Journal des visites</h2>
      <div class="outils"><input class="champ" type="date" id="jj" value="${jour}" style="min-width:0"><span class="vide">${nb(j.humains)} visiteur(s)${j.visiteurs - j.humains ? ` · ${nb(j.visiteurs - j.humains)} robot(s) probable(s), grisés` : ""} · heures de votre appareil · un clic montre le parcours</span></div>
      <table><tr><th>Heure</th><th>Durée</th><th>Pays</th><th>Appareil</th><th>Venu de</th><th>Pages</th><th>Parcours</th></tr>
      ${j.lignes.map(x => `<tr style="${x.robot ? "opacity:.45" : ""}"><td>${heure(x.premiere)}</td><td class="n">${duree(x.duree)}</td><td>${esc(PAYS_NOM(x.pays))}</td>
        <td>${esc(x.appareil)}${x.natif ? " · appli" : ""}${x.connecte ? " · compte" : ""}${x.jours_avant ? ` · <b class="ok">revenu</b>` : ""}</td><td>${esc(x.source || "direct")}</td><td class="n">${nb(x.pages)}</td>
        <td><details><summary>${(x.etapes || []).filter(e => !String(e[1]).startsWith("page:")).length} étape(s)</summary><div class="pile">${(x.etapes || []).map(e => heure(e[0]) + "  " + esc(nomEtape(String(e[1])))).join("\n")}</div></details></td></tr>`).join("") || `<tr><td colspan="7" class="vide">Aucune visite ce jour-là.</td></tr>`}</table></div>`;
  },
  async tunnel(jours){
    jours = jours || 30;
    const t = await api("/admin/tunnel?jours=" + jours);
    const base = Math.max(1, t.etapes[0].n);
    const arrets = Object.entries(t.tuto.arrets).sort((a, b) => b[1] - a[1]);
    return `<div class="bloc"><h2>Tunnel · ${jours} jours</h2>
      <div class="outils">${[7, 30, 90].map(n => `<button class="b ${n === jours ? "or" : ""}" data-j="${n}">${n} jours</button>`).join("")}</div>
      ${t.etapes.map((e, i) => { const prec = i ? t.etapes[i-1].n : e.n; return `<div class="br tunnel"><span>${esc(e.libelle)}</span><i style="width:${Math.max(2, 100*e.n/base)}%"></i><b>${nb(e.n)}</b><em>${i ? (prec ? Math.round(100*e.n/prec) : 0) + " % de l'étape précédente" : ""}</em></div>`; }).join("")}
      <p class="vide">Un visiteur = un appareil. « Revenus » : vus au moins deux jours différents. Robots et appareils exclus ne sont pas comptés.</p></div>
    <div class="grille large">
      <div class="bloc"><h2>Partie guidée</h2><p>${nb(t.tuto.debut)} lancée(s), ${nb(t.tuto.fin)} terminée(s)${t.tuto.debut ? ` (${Math.round(100*t.tuto.fin/t.tuto.debut)} %)` : ""}.</p>
        ${arrets.length ? `<h3>Où elle s'arrête</h3>${barres(arrets.map(([k, n]) => ({cle:"étape " + k, n})), "cle")}` : `<p class="vide">Aucun abandon.</p>`}</div>
      <div class="bloc"><h2>Modes lancés</h2>${barres(Object.entries(t.modes).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({cle:k, n})), "cle")}</div>
      <div class="bloc"><h2>Autres actions</h2>${barres(Object.entries(t.autres).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({cle:nomEtape(k), n})), "cle")}</div>
      <div class="bloc"><h2>Est-ce qu'ils reviennent ?</h2><p>${nb(t.retours.nouveaux)} nouveau(x) visiteur(s) sur la période, dont <b>${nb(t.retours.revenus)}</b> revenu(s) un autre jour${t.retours.nouveaux ? ` (${Math.round(100*t.retours.revenus/t.retours.nouveaux)} %)` : ""}.</p></div>
    </div>`;
  },
  async rappels(){
    const r = (resume || await api("/admin/resume")).rappels;
    return `<div class="bloc"><h2>Rappels par notification</h2>
      <p>${r && r.actif ? `<span class="ok">Actifs.</span> ${nb(r.abonnes)} abonnement(s) navigateur : ${nb(r.jour)} au défi du jour, ${nb(r.semaine)} au défi de la semaine.` : `<span class="ko">Inactifs</span> (module web-push absent du serveur).`}</p>
      <p class="vide">Les applis Android et iOS programment leurs rappels sur le téléphone : elles n'apparaissent pas ici.</p>
      <div class="outils"><button class="b or" id="test">M'envoyer un rappel de test</button><span id="test-res" class="vide"></span></div>
      <p class="vide">Pour recevoir le test : activez d'abord les rappels dans le jeu (Paramètres → Rappels) en étant connecté avec ce compte, dans ce navigateur.</p></div>`;
  },
};
const BRANCHER = {
  erreurs(){
    document.querySelectorAll("[data-effacer]").forEach(b => b.onclick = async () => { await api("/admin/erreurs?id=" + b.dataset.effacer, "DELETE"); resume = null; afficher(); });
    const t = $("#tout-effacer"); if(t) t.onclick = async () => { if(confirm("Effacer toutes les erreurs ?")){ await api("/admin/erreurs", "DELETE"); resume = null; afficher(); } };
  },
  joueurs(){
    const go = async () => { $("#main").innerHTML = await VUES.joueurs($("#recherche").value.trim()); BRANCHER.joueurs(); };
    $("#chercher").onclick = go; $("#recherche").onkeydown = e => { if(e.key === "Enter") go(); };
  },
  mots(){ document.querySelectorAll("[data-mot]").forEach(b => b.onclick = async () => { if(confirm("Retirer ce mot du jeu ?")){ await api("/admin/mots?id=" + b.dataset.mot, "DELETE"); afficher(); } }); },
  visites(){
    const b = $("#exclure"); if(b) b.onclick = async () => { try{ const v = localStorage.getItem("qln-vid"); if(v) await api("/admin/exclure", "POST", {v}); localStorage.setItem("qln-sans-stats", "1"); }catch(e){} afficher(); };
    api("/admin/visites").then(v => carteMonde(v.pays)).catch(() => {});
  },
  journal(){ const i = $("#jj"); i.onchange = async () => { $("#main").innerHTML = await VUES.journal(i.value); BRANCHER.journal(); }; },
  tunnel(){ document.querySelectorAll("[data-j]").forEach(b => b.onclick = async () => { $("#main").innerHTML = await VUES.tunnel(+b.dataset.j); BRANCHER.tunnel(); }); },
  rappels(){ $("#test").onclick = async () => { const el = $("#test-res"); try{ const d = await api("/admin/rappel-test", "POST"); el.textContent = d.abonnements ? `${d.envoyes} rappel(s) envoyé(s) sur ${d.abonnements} appareil(s).` : "Aucun appareil abonné avec ce compte."; }catch(e){ el.textContent = e.message; } }; },
};

(async () => {
  if(!API) return message("Pas de serveur configuré (config.js : QLN_API_URL).");
  if(!session) return message(`Connectez-vous d'abord dans le jeu avec votre compte administrateur (<b>Mon compte</b>), puis revenez sur cette page.<br><br><a href="./">Ouvrir le jeu</a>`);
  try{
    const {joueur} = await api("/moi");
    $("#qui").textContent = joueur.pseudo + (joueur.email ? " · " + joueur.email : "");
    if(!joueur.admin) return message(`Ce compte (${esc(joueur.pseudo)}) n'est pas administrateur.<br><br>Ajoutez son adresse dans la variable <b>ADMIN_EMAILS</b> du service sur Render (Environment), puis rechargez la page.`);
    afficher();
  }catch(e){
    message(e.status === 401 ? `Session expirée : reconnectez-vous dans le jeu.<br><br><a href="./">Ouvrir le jeu</a>` : `Serveur injoignable (${esc(e.message)}). Le service gratuit de Render peut mettre une minute à se réveiller : rechargez la page.`);
  }
})();
</script>
</body>
</html>
