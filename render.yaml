# Le-QLN — serveur (multijoueur + comptes + classements) sur Render.
# Mise en place unique : Render → New → Blueprint → dépôt Kiki78test/Le-QLN → Apply (la base dédiée est créée et branchée toute seule).
# Ensuite, chaque modification poussée dans server/ (ou analyse.js) est redéployée automatiquement,
# et seulement si les tests GitHub sont passés (autoDeployTrigger: checksPass).
services:
  - type: web
    name: le-qln
    runtime: node
    region: frankfurt          # proche des joueurs français
    plan: free                 # passer en "starter" (7 $/mois) à l'ouverture au public : pas de mise en veille
    # pas de rootDir : le serveur lit aussi ../analyse.js (mêmes règles que l'appli pour les mots contestés)
    buildCommand: cd server && npm install --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /sante
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - server/**
        - analyse.js
        - data/**
        - en/data/**
    envVars:
      - key: DATABASE_URL        # base dédiée ci-dessous, branchée automatiquement (adresse interne)
        fromDatabase:
          name: le-qln-db
          property: connectionString
      - key: SECRET              # générée une fois, ne jamais la changer (sinon tous les joueurs sont déconnectés)
        generateValue: true
      - key: ORIGINES
        value: https://kiki78test.github.io,capacitor://localhost   # site + appli iOS (jeu embarqué)
      - key: GOOGLE_CLIENT_ID    # facultatif
        sync: false
      - key: RESEND_API_KEY      # facultatif (mot de passe oublié, après l'achat du domaine)
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: le-qln-db           # base PostgreSQL dédiée au jeu (séparée d'Airmony)
    databaseName: qln
    user: qln
    region: frankfurt
    plan: basic-256mb          # ≈ 6 $/mois ; sauvegardes quotidiennes
    ipAllowList: []            # accessible seulement depuis les services Render (pas depuis Internet)
