<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:linear-gradient(#bfe9ff,#e9fbff 62%,#5d6670 62%)}
.route{position:absolute;left:0;right:0;top:222px;bottom:0;background:#4a525b}
.ligne{position:absolute;top:290px;left:0;width:1400px;height:8px;background:repeating-linear-gradient(90deg,#fff 0 50px,transparent 50px 110px);animation:def 1s linear infinite}
@keyframes def{to{transform:translateX(-110px)}}
.nuage{position:absolute;width:110px;height:34px;border-radius:30px;background:#fff;opacity:.9;animation:nu 9s linear infinite}
@keyframes nu{from{left:660px}to{left:-140px}}
.trott{position:absolute;left:230px;top:132px;animation:rebond .5s ease-in-out infinite alternate}
@keyframes rebond{to{transform:translateY(-5px)}}
.roue{position:absolute;width:62px;height:62px;border-radius:50%;border:9px solid #222;background:radial-gradient(#9fe870 0 30%,#fff 31% 34%,transparent 35%);top:106px}
.roue::after{content:"";position:absolute;inset:6px;border-radius:50%;border-top:4px solid #444;animation:rot .5s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.plateau{position:absolute;left:30px;top:96px;width:150px;height:14px;background:#7dd34a;border-radius:8px}
.mat{position:absolute;left:150px;top:-40px;width:12px;height:140px;background:#2e3640;border-radius:6px;transform:rotate(-10deg)}
.guidon{position:absolute;left:112px;top:-46px;width:70px;height:10px;background:#2e3640;border-radius:6px}
.t1{position:absolute;left:0;right:0;top:36px;text-align:center;color:#1d5ea8;font-size:48px;z-index:3}
.s2{background:linear-gradient(135deg,#0d3b2a,#1f8a4d)}.eclair{position:absolute;left:230px;top:20px;width:180px;height:230px;background:#ffe34d;clip-path:polygon(55% 0,12% 56%,44% 56%,30% 100%,88% 38%,54% 38%);animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{to{filter:drop-shadow(0 0 24px #ffe34d);transform:scale(1.06)}}
.t2{position:absolute;left:0;right:0;bottom:44px;text-align:center;color:#fff;font-size:44px}
.s3{background:#0d3b2a;display:grid;place-items:center;text-align:center;color:#fff}
.marque{font-size:82px;color:#9fe870}.slogan{font-size:28px;font-weight:600}.cta{margin-top:18px;display:inline-block;background:#9fe870;color:#0d3b2a;font-weight:800;font-size:24px;padding:8px 24px;border-radius:30px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
</style>
<div class="scene s1"><i class="nuage" style="top:30px"></i><i class="nuage" style="top:110px;animation-delay:-4s"></i><div class="route"></div><div class="ligne"></div>
<div class="trott"><div class="plateau"></div><div class="mat"></div><div class="guidon"></div><div class="roue" style="left:20px;top:100px"></div><div class="roue" style="left:140px;top:100px"></div></div>
<div class="t1 titre pop">Roulez léger</div></div>
<div class="scene s2"><div class="eclair"></div><div class="t2 titre pop">40 km d'autonomie<br>Recharge en 2 heures</div></div>
<div class="scene s3"><div><div class="marque titre">Voltaïa</div><div class="slogan">La trottinette qui va plus loin</div><div class="cta">En savoir plus</div></div></div>
<div class="mention">Publicité fictive · simulation</div>
