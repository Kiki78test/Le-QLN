<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:radial-gradient(100% 100% at 30% 0,#3b2a8c,#14083d)}
.tuiles{position:absolute;left:0;right:0;top:120px;display:flex;justify-content:center;gap:10px}
.tuile{width:64px;height:70px;border-radius:12px;display:grid;place-items:center;font:800 46px "Arial Narrow",Arial;color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 7px 0 rgba(0,0,0,.35);animation:fl2 .6s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:var(--d)}
@keyframes fl2{from{transform:translateY(-120px) rotate(-30deg);opacity:0}}
.t1{position:absolute;left:0;right:0;top:34px;text-align:center;color:#ffe34d;font-size:44px}
.s2{background:linear-gradient(135deg,#ff6a3d,#ffb347)}
.etoile{position:absolute;width:60px;height:60px;background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:tourne 2s linear infinite}
@keyframes tourne{to{transform:rotate(360deg) scale(1.2)}}
.t2{position:absolute;left:0;right:0;top:130px;text-align:center;color:#fff;font-size:64px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.s3{background:#14083d;display:grid;place-items:center;text-align:center;color:#fff}
.marque{font-size:84px;color:#ffe34d}.slogan{font-size:28px;font-weight:600}.cta{margin-top:18px;display:inline-block;background:#ff6a3d;color:#fff;font-weight:800;font-size:24px;padding:8px 24px;border-radius:30px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
</style>
<div class="scene s1"><div class="t1 titre pop">Un nouveau jeu<br>chaque semaine</div>
<div class="tuiles"><i class="tuile" style="--d:.2s;background:#2fa84f">P</i><i class="tuile" style="--d:.4s;background:#2f6fe0">I</i><i class="tuile" style="--d:.6s;background:#e03b3b">X</i><i class="tuile" style="--d:.8s;background:#7a3fc4">E</i><i class="tuile" style="--d:1s;background:#e98a1d">L</i><i class="tuile" style="--d:1.2s;background:#1a1a1f">I</i><i class="tuile" style="--d:1.4s;background:#2fa84f">A</i></div></div>
<div class="scene s2"><i class="etoile" style="left:60px;top:40px"></i><i class="etoile" style="left:520px;top:60px;animation-delay:-.7s"></i><i class="etoile" style="left:90px;top:250px;animation-delay:-1.1s"></i><i class="etoile" style="left:500px;top:240px;animation-delay:-.3s"></i>
<div class="t2 titre pop">Gratuit<br>et sans prise de tête</div></div>
<div class="scene s3"><div><div class="marque titre">Pixelia</div><div class="slogan">Le studio qui fait jouer</div><div class="cta">Télécharger</div></div></div>
<div class="mention">Publicité fictive · simulation</div>
